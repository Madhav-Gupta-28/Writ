        fill="#e4531b" stroke="#111111" stroke-width="28"/>
  <path d="M116 158 L190 374 L256 190 L322 374 L396 158"
        fill="none" stroke="#111111" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
